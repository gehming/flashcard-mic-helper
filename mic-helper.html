<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文發音評測麥克風</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#1f2937;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(620px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 12px 36px #1f29371a}h1{font-size:1.45rem;margin:0 0 8px}.muted{color:#64748b;line-height:1.65}.target{font-size:2rem;font-weight:750;text-align:center;background:#eff6ff;border-radius:14px;padding:20px;margin:20px 0;overflow-wrap:anywhere}.status{padding:14px;border-radius:10px;background:#f1f5f9;line-height:1.6;margin:16px 0;white-space:pre-wrap}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:650;cursor:pointer}#start{background:#2563eb;color:white}#cancel{background:#e2e8f0;color:#1e293b}button:disabled{opacity:.55;cursor:default}.hint{font-size:.9rem;color:#64748b;margin-top:16px}
</style></head>
<body><main class="panel">
<h1>英文發音評測</h1><p class="muted">請確認瀏覽器網址列的麥克風權限已允許，然後按下「開始辨識」。</p>
<div class="target" id="target">載入中…</div>
<div class="status" id="status" role="status">準備就緒。按下開始後，請清楚唸出上方英文。</div>
<div class="buttons"><button id="start">🎙️ 開始辨識</button><button id="cancel" type="button">取消並返回</button></div>
<p class="hint">辨識完成後，文字會傳回原本的閃卡頁面並顯示評分。若瀏覽器不支援語音辨識，請使用最新版 Chrome 或 Edge。</p>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const requestId=params.get('requestId')||'';
 const target=params.get('target')||'';
 const label=params.get('label')||'單字';
 const targetEl=document.getElementById('target');
 const statusEl=document.getElementById('status');
 const startBtn=document.getElementById('start');
 const cancelBtn=document.getElementById('cancel');
 targetEl.textContent=target||'未指定評測內容';
 let recognition=null,finished=false;
 function sendResult(payload){
   if(finished)return; finished=true;
   const message=Object.assign({type:'flashcard-pronunciation-result',requestId:requestId},payload);
   if(window.opener&&!window.opener.closed){window.opener.postMessage(message,'*');}
   statusEl.textContent=payload.error ? ('評測失敗：'+payload.error+'\n可以調整權限後重新開始。') : ('辨識完成：'+payload.transcript+'\n結果已傳回閃卡頁面。');
   startBtn.disabled=false; startBtn.textContent='重新辨識';
 }
 startBtn.addEventListener('click',function(){
   const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SpeechRec){statusEl.textContent='此瀏覽器不支援 Web Speech API，請改用最新版 Chrome 或 Edge。';return;}
   finished=false;startBtn.disabled=true;statusEl.textContent='正在聆聽，請清楚唸出英文…';
   try{
     recognition=new SpeechRec(); recognition.lang='en-US'; recognition.continuous=false; recognition.interimResults=false; recognition.maxAlternatives=5;
     recognition.onresult=function(event){
       const alternatives=event.results&&event.results[0];
       if(!alternatives||!alternatives.length){sendResult({error:'沒有辨識到語音，請再試一次。'});return;}
       // 將所有候選合併為一段文字；主頁評分器可照常評分。
       const transcripts=[];for(let i=0;i<alternatives.length;i++){if(alternatives[i].transcript)transcripts.push(alternatives[i].transcript);}
       sendResult({transcript:transcripts[0]||'',confidence:alternatives[0].confidence||0.85});
     };
     recognition.onerror=function(event){
       let msg='未捕捉到清晰語音，請靠近麥克風再試一次。';
       if(event.error==='not-allowed'||event.error==='service-not-allowed'||event.error==='permission-denied')msg='麥克風權限遭拒。請點擊網址列左側的網站設定，允許麥克風後重新載入此頁。';
       else if(event.error==='no-speech')msg='未偵測到聲音，請清楚唸出英文後重試。';
       else if(event.error==='network')msg='語音辨識網路服務連線異常，請檢查網路後重試。';
       sendResult({error:msg});
     };
     recognition.onend=function(){if(!finished){startBtn.disabled=false;statusEl.textContent='辨識已結束，若沒有結果請再按一次開始辨識。';}};
     recognition.start();
   }catch(e){startBtn.disabled=false;statusEl.textContent='無法啟動語音辨識：'+(e.message||e);}
 });
 cancelBtn.addEventListener('click',function(){try{if(recognition)recognition.abort();}catch(e){}if(window.opener&&!window.opener.closed)window.close();else history.back();});
})();
</script></body></html>
